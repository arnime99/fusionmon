# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Mod Properties
version=0.1.0-beta
group=com.arnau.fusionmon

# Dependencies
fabric_api_version=0.116.17+1.21.1
cobblemon_version=1.8.1+1.21.1

# Plugin de Kotlin: solo para que Loom remapee los metadatos Kotlin de Cobblemon
kotlin_version=2.4.20
# El runtime de Kotlin lo pone Fabric Language Kotlin (viene con Cobblemon); que el plugin no añada otro
kotlin.stdlib.default.dependency=false
