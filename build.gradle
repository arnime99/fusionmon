plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	// No escribimos Kotlin, pero Loom solo remapea los metadatos Kotlin de Cobblemon
	// (los que lee kotlin-reflect) si este plugin está aplicado. Sin él: ClassNotFoundException class_2960.
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
	id 'maven-publish'
}

repositories {
	// Maven oficial de Cobblemon. Su POM trae Fabric Language Kotlin (y con él Kotlin) y el resto de dependencias.
	maven {
		name = "Cobblemon"
		url = "https://maven.impactdev.net/repository/development/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fusionmon" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			// Sin esto Loom usa un nombre aleatorio (Player123) en cada arranque, y como Cobblemon
			// guarda el equipo y el PC por jugador, cada arranque parecía un jugador nuevo
			programArgs "--username", "Arnau"
		}
		server {
			// Carpeta propia: cliente y servidor se lanzan a la vez y si no compartirían
			// logs, configuración y mundo en run/
			runDir "run/server"
		}
	}
}

// Showdown (GraalJS, dentro de Cobblemon) necesita ICU4J. Cobblemon pide la 71.1, pero Gradle la sube a la 73.2
// del cliente de Minecraft, y runServer quita las librerías solo de cliente: el servidor de pruebas se quedaba sin
// ICU4J (NoClassDefFoundError com/ibm/icu/text/DateFormat). En un servidor real no pasa, porque Cobblemon la lleva
// dentro de su jar; aquí se añade esa misma versión solo al servidor de pruebas (no va al jar del mod).
tasks.named("runServer") {
	classpath(project.configurations.detachedConfiguration(project.dependencies.create("com.ibm.icu:icu4j:71.1")))
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

kotlin {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
// Gradle corre con Java 26, pero Cobblemon exige Java 21 para arrancar: el juego (cliente y servidor) se lanza con 21
["runClient", "runServer"].each { runTask ->
	tasks.named(runTask) {
		javaLauncher = javaToolchains.launcherFor {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}
}